version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: scoutd3_db
    environment:
      POSTGRES_DB: scoutd3
      POSTGRES_USER: scoutd3
      POSTGRES_PASSWORD: scoutd3
      POSTGRES_TIMEZONE: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - scoutd3_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutd3 -d scoutd3"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: scoutd3_redis
    ports:
      - "6379:6379"
    networks:
      - scoutd3_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: scoutd3_backend
    environment:
      - DATABASE_URL=postgresql://scoutd3:scoutd3@db:5432/scoutd3
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scoutd3_network
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./static:/app/static
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: scoutd3_frontend
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000/api/v1
      - REACT_APP_ENVIRONMENT=production
      - REACT_APP_ACCESSIBILITY_LEVEL=AA
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - scoutd3_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: scoutd3_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - scoutd3_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  scoutd3_network:
    driver: bridge