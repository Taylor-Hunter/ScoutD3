# ScoutD3 Prometheus Configuration
# Monitoring setup for my NCAA Division III scouting system

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # ScoutD3 Backend API
  - job_name: 'scoutd3-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s
    
  # PostgreSQL Database
  - job_name: 'scoutd3-postgres'
    static_configs:
      - targets: ['postgres:5432']
    
  # Redis Cache
  - job_name: 'scoutd3-redis'
    static_configs:
      - targets: ['redis:6379']
    
  # Nginx Reverse Proxy
  - job_name: 'scoutd3-nginx'
    static_configs:
      - targets: ['nginx:80']
    
  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']